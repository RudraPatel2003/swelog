[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[workspace.package]
authors = ["Rudra Patel <patelrudra2003@gmail.com>"]
edition = "2024"
description = "A Rust CLI to track your daily accomplishments in Obsidian"
keywords = ["rust", "cli", "obsidian", "daily", "log"]
categories = ["command-line-utilities"]
repository = "https://github.com/RudraPatel2003/swelog-cli"
homepage = "https://github.com/RudraPatel2003/swelog-cli"
readme = "README.md"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
dirs = "6.0.0"
futures = "0.3.32"
keyring = "4.1.6"
miette = "7.6.0"
oauth2 = { version = "5.0.0", default-features = false }
ollama-rs = "0.3.4"
owo-colors = { version = "4.3.0", features = ["supports-colors"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
reqwest = { version = "0.13.4", features = ["form", "json", "query"] }
rmcp = { version = "3.1.3", default-features = false, features = [
    "auth",
    "client",
    "reqwest",
    "transport-streamable-http-client-reqwest",
] }
rpassword = "7.5.4"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
url = "2.5.8"
webbrowser = "1.2.4"
