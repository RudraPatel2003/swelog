[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["Rudra Patel <patelrudra2003@gmail.com>"]
edition = "2024"
description = "A Rust CLI to track your daily accomplishments in Obsidian"
keywords = ["rust", "cli", "obsidian", "daily", "log"]
categories = ["command-line-utilities"]
repository = "https://github.com/RudraPatel2003/swelog-cli"
homepage = "https://github.com/RudraPatel2003/swelog-cli"
readme = "README.md"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1.89"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
miette = "7.6.0"
ollama-rs = "0.3.4"
owo-colors = "4.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
