#
# The purpose of this workflow is to cache the dependencies of the main branch so that it can speed up PRs.
# When a PR is opened, it can only look for caches in its own branch (which doesn't exist yet) and the main branch.
# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/caching-dependencies-to-speed-up-workflows#restrictions-for-accessing-a-cache
#

name: cache

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"

jobs:
  cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Keep the pinned toolchain in sync with rust-toolchain.toml.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-18
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-dependencies-cache"

      #
      # Nothing is cached unless the dependencies are actually built here.
      # Clippy is a check build that only produces metadata, while tests need
      # real codegen, so both have to run for a PR to get a full cache hit.
      #
      - name: Build dependencies
        run: |
          cargo clippy --workspace --all-targets --all-features
          cargo test --workspace --all-features --no-run
