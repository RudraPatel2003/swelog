name: docs-check

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main
    paths:
      - "docs/**"
      - "justfile"
      - "just/docs.just"
      - ".github/workflows/pr-docs.yaml"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Setup lychee
        uses: taiki-e/install-action@v2
        with:
          tool: lychee

      # Must come before setup-node so that `cache: "pnpm"` can find pnpm.
      # The version is read from the `packageManager` field in docs/package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "pnpm"
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: just docs-install --frozen-lockfile

      - name: Run docs checks
        run: just docs-pr
