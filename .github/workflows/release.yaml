name: release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"

permissions:
  contents: write

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest

    outputs:
      release-tag: ${{ steps.release-tag.outputs.release-tag }}
      should-release: ${{ steps.draft-release.outputs.should-release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust-toolchain

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-dependencies-cache"

      - name: Check release version
        run: just check-release-version

      - name: Get release tag
        id: release-tag
        run: echo "release-tag=$(just list-release-tag)" >> "$GITHUB_OUTPUT"

      - name: Draft release
        id: draft-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.release-tag }}
        run: |
          is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)

          if [ "$is_draft" = "false" ]; then
            echo "Release $RELEASE_TAG is already published"
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$is_draft" = "missing" ]; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --title "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi

          echo "should-release=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs:
      - create-release
    if: needs.create-release.outputs.should-release == 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: swelog-x86_64-unknown-linux-gnu
            executable: swelog

          - os: macos-latest
            target: x86_64-apple-darwin
            asset: swelog-x86_64-apple-darwin
            executable: swelog

          - os: macos-latest
            target: aarch64-apple-darwin
            asset: swelog-aarch64-apple-darwin
            executable: swelog

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: swelog-x86_64-pc-windows-msvc.exe
            executable: swelog.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust-toolchain
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-dependencies-cache"

      - name: Build release binary
        run: just build-release "${{ matrix.target }}"
        env:
          SWELOG_GOOGLE_CLIENT_ID: ${{ secrets.SWELOG_GOOGLE_CLIENT_ID }}
          SWELOG_GOOGLE_CLIENT_SECRET: ${{ secrets.SWELOG_GOOGLE_CLIENT_SECRET }}

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/${{ matrix.asset }}"
          chmod 755 "dist/${{ matrix.asset }}"

      - name: Upload release asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - create-release
      - build

    env:
      RELEASE_TAG: ${{ needs.create-release.outputs.release-tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Setup cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust-toolchain
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-dependencies-cache"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Run release checks
        run: just npm-release-check

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum swelog-* > SHA256SUMS

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/swelog-* dist/SHA256SUMS --clobber

      # The npm install script downloads binaries from the release, so it must be published first.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Publish npm package
        run: just npm-publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
